<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#C0392B"/>
  <!-- Inner subtle circle -->
  <circle cx="256" cy="256" r="200" fill="#A93226" opacity="0.4"/>
  <!-- Pizza slice shape -->
  <g transform="translate(256,220)">
    <!-- Crust arc -->
    <path d="M-90,-60 A108,108 0 0,1 90,-60" stroke="#FAF6EE" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Triangle body -->
    <polygon points="-90,-60 90,-60 0,110" fill="#FAF6EE" opacity="0.18"/>
    <!-- Triangle outline -->
    <polygon points="-90,-60 90,-60 0,110" fill="none" stroke="#FAF6EE" stroke-width="10" stroke-linejoin="round" opacity="0.7"/>
    <!-- Toppings dots -->
    <circle cx="-20" cy="-10" r="10" fill="#FAF6EE" opacity="0.55"/>
    <circle cx="28" cy="0" r="8" fill="#FAF6EE" opacity="0.55"/>
    <circle cx="0" cy="30" r="9" fill="#FAF6EE" opacity="0.55"/>
    <circle cx="-38" cy="20" r="7" fill="#FAF6EE" opacity="0.45"/>
  </g>
  <!-- LT text -->
  <text x="256" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="white" opacity="0.95" letter-spacing="6">LT</text>
</svg>
